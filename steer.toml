# Steer Content Intelligence Pipeline: model settings (hackathon prototype).
# Each job names an ordered fallback chain of endpoints. A link whose key environment variable is
# not set is skipped. Keys are never written here: only the NAME of the environment variable.
version = 1

[jobs.extract]
chain = ["claude_sonnet", "claude_opus", "anthropic_sonnet"]

[jobs.write]
chain = ["claude_sonnet", "claude_opus", "anthropic_sonnet"]

[jobs.label]
chain = ["claude_haiku", "claude_sonnet", "anthropic_haiku"]

# The cross-check reads claims against their quotes with a DIFFERENT model family from the writer:
# OpenCode first (low volume, batched), Claude Opus as the fallback (the writer will not be Opus).
[jobs.crosscheck]
chain = ["opencode_glm", "opencode_deepseek", "claude_opus"]

# The learning loop's caption labels (theme, doubt): a small constrained call on a non-Claude model.
[jobs.learn_label]
chain = ["opencode_glm", "opencode_deepseek"]

# Claude Code headless, on the logged-in Claude account (minimal context, no tools).
[endpoints.claude_sonnet]
connector = "claude_cli"
model = "sonnet"
timeout = 300

[endpoints.claude_opus]
connector = "claude_cli"
model = "opus"
timeout = 300

[endpoints.claude_haiku]
connector = "claude_cli"
model = "haiku"
timeout = 300

# The Anthropic Messages API (for teams with their own key).
[endpoints.anthropic_sonnet]
connector = "anthropic_api"
model = "claude-sonnet-5-5"
key_env = "ANTHROPIC_API_KEY"
timeout = 300

[endpoints.anthropic_haiku]
connector = "anthropic_api"
model = "claude-haiku-5-5"
key_env = "ANTHROPIC_API_KEY"
timeout = 300

# Any OpenAI-compatible endpoint (OpenAI, OpenCode Go, OpenRouter, a local vLLM or Ollama...).
# OpenCode Go model ids verified 2026-10-18 against https://opencode.ai/inference/go/v1/models.
# Both have 0-day retention and no training use per the OpenCode Go docs (DeepSeek's zero data retention is
# renewed monthly; the agreement then current ran to 2026-10-31). Never use a "contributor" model.
[endpoints.opencode_glm]
connector = "openai_compatible"
base_url = "https://opencode.ai/inference/go/openai/v1"
model = "glm-5.3"
key_env = "OPENCODE_GO_API_KEY"
timeout = 90                                # on timeout the router falls back to the next link
# GLM-5.3 always thinks; low effort cut hidden reasoning from 164 to 9 tokens on a probe (2026-10-18)
extra_body = {reasoning_effort = "low"}

[endpoints.opencode_deepseek]
connector = "openai_compatible"
base_url = "https://opencode.ai/inference/go/openai/v1"
model = "deepseek-v4-pro"
key_env = "OPENCODE_GO_API_KEY"
timeout = 300

# Controlled vocabularies for labels (Steer can extend them). Codes, not free text.
[labels]
themes = ["glp1_how_it_works", "insulin_resistance", "lean_mass_during_weight_loss", "weight_regain",
          "indian_food_and_life"]
doubts = ["is_it_safe", "will_i_lose_muscle", "will_weight_come_back", "only_for_diabetics", "is_it_for_me"]
batch = 20

# Rules check (code only). Word lists are matched as whole words or phrases, case-insensitive; patterns
# with numbers live in code. Bump the version whenever a list changes.
[rules]
version = "rules-1"
drug_brands = ["Ozempic", "Wegovy", "Mounjaro", "Zepbound", "Rybelsus", "Saxenda", "Victoza", "Trulicity",
               "Byetta", "Bydureon", "Adlyxin", "Xenical", "Qsymia", "Contrave"]
drug_names = ["semaglutide", "tirzepatide", "liraglutide", "dulaglutide", "exenatide", "lixisenatide",
              "orforglipron", "retatrutide", "cagrilintide", "orlistat", "phentermine"]
promise_words = ["guaranteed", "guarantee", "miracle", "melt away", "melts fat", "melt fat", "effortless",
                 "without dieting", "permanent weight loss", "cure obesity", "lose weight fast"]
hype_words = ["outsmart", "secret", "shocking", "surprised even", "doctors hate", "game changer", "game-changer",
              "breakthrough", "magic", "hack", "you won't believe"]
before_after = ["before and after", "before/after", "before & after", "transformation photo", "body transformation"]

# Where `steer run` stores documents, claims and run records (relative to the working directory).
[storage]
db = "steer.db"

# Writer settings. Hashtags are a fixed vocabulary (placeholder; edit freely): never drug names, brands or promises.
[writer]
hashtags = ["#steerclub", "#metabolichealth", "#doctorled", "#weightmanagement", "#metaboliccare", "#indianfood",
            "#healthyhabits", "#insulinresistance", "#musclehealth", "#evidencebased", "#lifestylemedicine",
            "#southasianhealth", "#longtermhealth", "#nutritionscience"]
brief_claims = 4   # claims picked for an automatic brief

# The reel's voice (S7-min). A placeholder chosen for the build; the final voice is a settings change only.
# edge-tts is Microsoft's online voice service: each line's text is sent to it.
# provider = "elevenlabs": ElevenLabs' online voice (the text leaves the box), key ONLY from ~/steer-secrets/elevenlabs.env
# (ELEVENLABS_API_KEY); audio cached in ~/.cache/steer-tts; "Voice: AI-generated (ElevenLabs)" goes in the caption.
# If it fails, the whole reel is voiced with edge-tts (name/rate below), unless the reel has presenter clips: then it fails.
[voice]
provider = "edge-tts"           # the user's final pick (Neerja); "elevenlabs" (Sarah, trials/voice-1) stays an option
name = "en-IN-NeerjaExpressiveNeural"
rate = "+8%"
voice_id = "EXAVITQu4vr4xnSDxMaL"   # ElevenLabs premade "Sarah - Mature, Reassuring, Confident"
model = "eleven_multilingual_v2"

# `steer batch` (S8): the posting time of week.ics (Asia/Kolkata), the S6 loop's files that order the week (relative to the
# repository root), and the two neutral b-roll clips the reel slots alternate between (the thali/food clip is never used here).
[batch]
post_time = "19:00"
learn_dir = "trials/s6-1"
broll = ["trials/broll-1/clips/lane-s19.mp4", "trials/broll-2/clips/balcony-s19.mp4"]
