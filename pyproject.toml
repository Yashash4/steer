[project]
name = "steer-pipeline"
version = "0.1.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Steer Content Intelligence Pipeline (hackathon prototype): research papers in, traceable source-checked documents out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "playwright==1.64.0",
    "edge-tts==7.3.1",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
steer = "steer_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steer_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live public APIs (opt-in: pytest -m network)"]
addopts = "-m 'not network'"
