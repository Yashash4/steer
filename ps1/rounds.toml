# PS1 "Guess the number": rounds and quiz copy. Rounds find their claim by a QUOTE FRAGMENT in a stored run, never by
# a typed number. `steer ps1 build` fails unless each round's claim is verified (D-021) or cleared in the studio (S4),
# and runs every line of copy through the PS2 checks. A round with `fallback_gap` becomes that gap card instead when
# its claim is not usable (the build says so).

wordmark = "steer"
signoff = "steerclub.com"
# added to the qualifiers of every round whose paper is a single study (design = "single_study"), never to a review
single_study_note = "A comparison between groups in one study, not a prediction for you."
footer = "Educational hackathon prototype · content pending review by a Steer doctor · not a medical assessment"

