[[doubt]]
id = "is_it_safe"
label = "Is it safe?"
answered_by = ["safety"]

[[doubt]]
id = "will_i_lose_muscle"
label = "Will I lose muscle?"
answered_by = ["muscle-a", "muscle-b"]

[[doubt]]
id = "will_weight_come_back"
label = "Will the weight come back?"
answered_by = ["regain"]

[[doubt]]
id = "only_for_diabetics"
label = "Is this only for diabetics?"
answered_by = ["gap-diabetics"]

[[doubt]]
id = "is_it_for_me"
label = "Is it even for me?"
answered_by = ["hook"]

[[round]]
id = "hook"
design = "single_study"
doubt = "is_it_for_me"
pmcid = "PMC8006839"
quote_contains = "the risk of diabetes in those with BMI <25 kg/m2 was 5.3 times higher"
kind = "choice"
opener = "chai"
# who and what was studied: its numbers must be in the claim's quote or the paper's context quotes
context = "South Asian women aged 45+ with BMI below 25 in Chennai, Delhi and Karachi, compared with US white women."
question = "Think a 'normal' BMI rules out diabetes?"
prompt = "Guess: how did diabetes rates compare?"
# one tap = guess + reveal. The value of a stop is the lower end of its bin (compared, never drawn); the answer is scored
# by the bin it falls in (5.3 -> the last bin), so no label is the answer's own number.
stops = [["About the same", 1], ["About 2×", 2], ["About 3×", 3], ["5× or more", 5]]
answer = 5.3
sentence = "South Asian women aged 45 and over in Chennai, Delhi and Karachi with BMI under 25 kg/m2 had a 5.3 times higher risk of diabetes than US whites."
reveal_number = "5.3 times"
reveal_label = "higher risk of diabetes"
qualifiers = []

[[round]]
id = "regain"
design = "review"
opener = "bus"
doubt = "will_weight_come_back"
pmcid = "PMC12776922"
quote_contains = "The average monthly rate of weight regain was 0.4 kg"
kind = "slider"
question = "After stopping a weight management medicine, how fast does weight come back each month?"
stops = [["None", 0], ["0.1 kg", 0.1], ["0.4 kg", 0.4], ["1 kg", 1], ["2 kg", 2]]
answer = 0.4
sentence = "On average, the monthly rate of weight regain was 0.4 kg (95% CI 0.3 to 0.5)."
reveal_number = "0.4 kg"
reveal_label = "monthly rate of weight regain"
qualifiers = ["An average across studies, not a prediction for you.", "All weight-management medicines, not only GLP-1."]
fallback_gap = "gap-regain"

[[round]]
id = "muscle-a"
design = "review"
opener = "park"
doubt = "will_i_lose_muscle"
pmcid = "PMC13461373"
quote_contains = "a significant decrease was observed in the absolute change in lean mass"
kind = "choice"
question = "On these medicines, does the amount of lean mass in kilograms go up, down or stay the same?"
stops = [["Up", "up"], ["Down", "down"], ["No change", "same"]]
answer = "down"
sentence = "Absolute lean mass changed by −1.74 kg on average."
reveal_number = "−1.74 kg"
reveal_label = "Absolute lean mass changed"
qualifiers = ["Results varied a lot between studies."]
fallback_gap = "gap-muscle"

[[round]]
id = "muscle-b"
design = "review"
opener = "wedding"
doubt = "will_i_lose_muscle"
pmcid = "PMC13461373"
quote_contains = "lean mass as a proportion of total weight, with an observed increase of 1.81%"
kind = "choice"
question = "And lean mass as a share of body weight: up, down or the same?"
stops = [["Up", "up"], ["Down", "down"], ["No change", "same"]]
answer = "up"
sentence = "Lean mass as a share of total weight rose by 1.81% on average."
reveal_number = "1.81%"
reveal_label = "Lean mass as a share of total weight rose"
qualifiers = ["Results varied a lot between studies.", "The authors advise nutrition and exercise alongside treatment."]
fallback_gap = "gap-muscle"

[[round]]
id = "safety"
design = "review"
doubt = "is_it_safe"
opener = "dinner"
pmcid = "PMC12532569"
quote_contains = "Nausea, vomiting, diarrhea, and constipation were the most common gastrointestinal adverse effects"
kind = "choice"
question = "Which kind of side effect was most common in these trials?"
stops = [["Stomach and gut problems", "stomach"], ["Skin problems", "skin"], ["Sleep problems", "sleep"]]
answer = "stomach"
sentence = "Nausea, vomiting, diarrhea, and constipation were the most common gastrointestinal adverse effects."
# no number in this round: the label is drawn large instead
reveal_number = ""
reveal_label = "Mostly stomach and gut side effects"
qualifiers = ["These findings are about this class of medicines, not one product.", "Measured in clinical trials.",
              "A doctor weighs the benefits against the side effects for each person."]
fallback_gap = "gap-safety"

[[gap]]
id = "gap-safety"
opener = "dinner"
title = "Is it safe?"
body = "Our papers don't answer this well. Ask a doctor about it, with your own history."

[[gap]]
id = "gap-diabetics"
opener = "balcony"
# an info card, not a guess. Its context line is the paper's own population sentence (the gate-checked context quote
# ctx-1 of the safety paper's boundaries file); context_phrase must be a substring of that quote.
pmcid = "PMC12532569"
context = "This review looked at non-diabetic subjects with overweight or obesity."
context_phrase = "non-diabetic subjects with overweight or obesity"
title = "Is this only for diabetics?"
body = "Our papers don't answer this well. Ask a doctor about it, with your own history."

[[gap]]
id = "gap-regain"
opener = "bus"
title = "Will the weight come back?"
body = "Our checked papers don't answer this well enough yet. Ask a doctor about it, with your own history."

[[gap]]
id = "gap-muscle"
opener = "park"
title = "Will I lose muscle?"
body = "Our checked papers don't answer this well enough yet. Ask a doctor about it, with your own history."

