:root{--cream:#F5EBDF;--rust:#C04E2A;--maroon:#661414;--ink:#351D1D;--clay:#B58777;--blush:#E6CBBD;--paper:#F8F2EB;
--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
header,main,footer{width:100%;max-width:560px;margin:0 auto;padding-left:20px;padding-right:20px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:20px;padding-bottom:4px;font-family:var(--serif);font-style:italic;font-variation-settings:'WONK' 0,'SOFT' 50;font-size:30px;font-weight:600;color:var(--maroon);letter-spacing:-.01em}
main{flex:1;padding-top:12px;padding-bottom:28px}
footer{padding-top:18px;padding-bottom:28px;border-top:1px solid var(--blush);font-size:13px;color:var(--clay);display:flex;flex-wrap:wrap;gap:4px 14px}
footer span+span{position:relative}
.screen{display:flex;flex-direction:column;gap:20px;animation:enter .24s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3,.q{font-family:var(--serif);font-variation-settings:'WONK' 0,'SOFT' 50;font-weight:500;color:var(--maroon);margin:0;line-height:1.15;letter-spacing:-.01em}
.q{font-size:clamp(28px,8vw,40px)}
h2{font-size:clamp(26px,7vw,34px);font-style:italic}
h3{font-size:22px;font-style:italic}
.small{font-size:13px;color:var(--clay)}
.context{font-size:17px;color:var(--ink);font-weight:400;line-height:1.4}
.context.small{font-size:15px;color:var(--clay)}
.prompt{font-weight:600;font-size:18px;color:var(--maroon)}
.quals.tiny{gap:2px}.quals.tiny li{font-size:13px;color:var(--clay);padding:0 0 0 10px;margin:0;border-left:3px solid var(--blush);border-bottom:0}
h4{font:600 15px var(--sans);color:var(--maroon);margin:8px 0 0}
p{margin:0}
.btn{appearance:none;border:0;cursor:pointer;font:600 17px/1.2 var(--sans);min-height:56px;padding:14px 28px;border-radius:999px;background:var(--rust);color:var(--cream);transition:transform .15s,opacity .15s,background .15s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn:hover{background:var(--maroon)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;background:var(--rust)}
.btn.alt{background:transparent;color:var(--maroon);border:2px solid var(--maroon)}
.btn.alt:hover{background:var(--blush)}
:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
/* choices */
.choices{display:flex;flex-direction:column;gap:12px}
.choice{appearance:none;cursor:pointer;min-height:64px;padding:14px 20px;border-radius:18px;border:2px solid var(--blush);background:var(--paper);color:var(--ink);font:600 18px/1.3 var(--sans);text-align:left;transition:transform .15s,border-color .15s,background .15s}
.choice:hover{border-color:var(--rust);background:#fff8f0}
.choice:active{transform:scale(.98)}
/* reveal */
.reveal{background:var(--paper);border:1px solid var(--blush);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.numrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.num{font-family:var(--serif);font-variation-settings:'WONK' 0,'SOFT' 50;font-weight:600;font-size:clamp(46px,15vw,76px);line-height:1;color:var(--rust);letter-spacing:-.02em}
.rlabel{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--maroon);line-height:1.2}
.sentence{font-size:17px}
.quals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.quals li{padding-left:14px;border-left:3px solid var(--rust);font-size:15px}
.src{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;color:var(--clay)}
.src span+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--clay);margin-right:10px;vertical-align:middle}
.link{appearance:none;background:none;border:0;padding:12px 0;min-height:48px;font:600 15px var(--sans);color:var(--rust);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.quote{background:var(--paper);border-left:4px solid var(--clay);padding:14px 16px;border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.quote blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:17px}
.quote[hidden]{display:none}
/* chips */
.chips{display:flex;flex-direction:column;gap:12px}
.chip{appearance:none;cursor:pointer;min-height:60px;padding:12px 20px;border-radius:999px;border:2px solid var(--blush);background:var(--paper);color:var(--ink);font:600 18px/1.25 var(--sans);text-align:left;transition:background .15s,border-color .15s,color .15s,transform .15s;display:flex;flex-direction:column;justify-content:center}
.chip:active{transform:scale(.98)}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--cream)}
.chip.done{background:transparent;border-style:dashed;cursor:default;color:var(--clay)}
.chip small{font-size:12px;font-weight:500;color:var(--clay)}
/* gap / readout / cards */
.card{background:var(--paper);border:1px solid var(--blush);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.card.gap{border-left:6px solid var(--clay)}
.big{font-family:var(--serif);font-style:italic;font-size:clamp(28px,8vw,38px);color:var(--rust);line-height:1.15;font-variation-settings:'WONK' 0,'SOFT' 50}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.list li{padding-bottom:12px;border-bottom:1px solid var(--blush)}
.list li:last-child{border:0;padding-bottom:0}
.warm{border:2px dashed var(--clay);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.row .num{font-size:30px}
.row .rlabel{font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 14px;border-radius:999px;background:var(--blush);color:var(--maroon);font-size:14px;font-weight:600}
.warm b{font-family:var(--serif);font-style:italic;color:var(--maroon);font-weight:600}
.progress{font-size:14px;font-weight:600;color:var(--clay)}
.opener{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35;color:var(--clay);font-variation-settings:'WONK' 0,'SOFT' 50}
.rlabel.lead{font-size:clamp(28px,8vw,40px);color:var(--rust);line-height:1.1}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--clay)}
.field input{font:500 17px var(--sans);min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--blush);background:var(--cream);color:var(--ink)}
.consent{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.consent input{width:24px;height:24px;accent-color:var(--maroon);flex:none}
.demo{font-weight:600;color:var(--maroon)}
.preview{background:var(--paper);border:1px solid var(--blush);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.preview[hidden]{display:none}
.progress{display:flex;align-items:center;gap:10px}
/* 10 s ring: starts only when .go is added (after the question, context and choices are drawn); at zero it just dims */
.ring{width:26px;height:26px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:4.5}
.ring .bg{stroke:var(--blush)}
.ring .fg{stroke:var(--rust);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;animation:ring 10s linear forwards;animation-play-state:paused}
.ring.go .fg{animation-play-state:running}
.ring.done{opacity:.3;transition:opacity .4s}
@keyframes ring{to{stroke-dashoffset:100}}
.hud{font:600 14px var(--sans);font-style:normal;letter-spacing:0;color:var(--clay);white-space:nowrap}
.hud[hidden]{display:none}
/* reveal: panel, labels, result, then the whole verified number (no count-up, no text change) */
.verdict{display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--paper);border:1px solid var(--blush);border-radius:20px;padding:18px 20px;animation:enter .35s ease-out both}
.rres{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(26px,7vw,34px);line-height:1.1;color:var(--maroon);font-variation-settings:'WONK' 0,'SOFT' 50}
.verdict .rres{animation:pop .4s .65s ease-out both}
.r-closest .rres,.rres.r-closest{color:var(--rust)}
.r-different .rres,.rres.r-different{color:var(--maroon)}
.pts{font:700 16px var(--sans);color:var(--clay);animation:pop .4s .75s ease-out both}
.cmp{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;color:var(--clay);font-size:15px;animation:enter .35s both}
.crow:nth-child(1){animation-delay:.2s}
.crow:nth-child(2){animation-delay:.4s}
.crow b{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--maroon);font-weight:600}
.final{display:flex;flex-direction:column;gap:20px;animation:pop .5s .95s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.sharebox:empty{display:none}
.sharecard{width:100%;height:auto;border-radius:16px;border:1px solid var(--blush)}
@media(min-width:760px){
body{font-size:19px}
header,main,footer{max-width:640px}
header{font-size:38px;padding-top:36px}
main{padding-top:28px}
.choices{flex-direction:row}.choice{flex:1}
.q{font-size:46px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top"></header>

a systematic review and network meta-analysis. International Journal of Obesity, 2025."},"claim_ids":["run-b78a76213417/c000-01"]}],"gap_cards":[{"id":"gap-diabetics","title":"Is this only for diabetics?","body":"Our papers don't answer this well. Ask a doctor about it, with your own history.","opener":"Tea with the neighbours on the balcony, and someone asks who these medicines are for.","context":"This review looked at non-diabetic subjects with overweight or obesity.","source":{"short":"Ismaiel et al. 2025"}}],"readout":{"numbers":"Closest range on {n} of {m} number guesses","direction":"Closest range on {n} of {m} direction guesses","meaning_title":"What these studies tell us — and what they don't"},"points":{"closest":3,"close":1,"different":0},"doctor_questions":{"is_it_for_me":["Should my lab tests be read differently because I am South Asian?"],"will_weight_come_back":["What would a planned exit look like for me?"],"will_i_lose_muscle":["How do we protect my muscle while I lose weight?"],"is_it_safe":["Which screening tests should come before any medicine?"],"only_for_diabetics":["Does my risk call for care before diabetes?"]},"cta":{"primary":{"label":"See if the programme fits you","url":"https://steerclub.com/?utm_source=steer_quiz&utm_campaign=guess_the_number"},"secondary":{"label":"Talk to a Steer doctor","url":"https://steerclub.com/?utm_source=steer_quiz&utm_campaign=guess_the_number"}},"warm_lead":{"title":"What your first conversation could start from","note":"Prototype only. Nothing is sent or stored. Use test details, not real contact information.","doubts_label":"Questions picked","guesses_label":"Guesses and the real numbers","name_label":"Name","phone_label":"Phone","consent_label":"I agree to be contacted (demo only)","show_label":"Show what Steer would receive","preview_title":"What Steer would receive","copy_label":"Copy my questions","share_label":"Share my questions","consent_short":"Consent","yes_label":"yes","your_guess":"Your guess","t <script>// Draws only strings from claims.json. Only computed numbers: readout counts n and m.
const main = document.querySelector("main");
const COMMA = String.fromCharCode(44);
const COLON = String.fromCharCode(58);
const DOT = String.fromCharCode(183);
const NL = String.fromCharCode(10);
const SEP = COLON + " ";
const DOTSEP = " " + DOT + " ";
// the svg namespace, split so no absolute url sits in this file
const SVGNS = ["http:", "", ["www", "w3", "org"].join(String.fromCharCode(46)), "2000", "svg"].join("/");
const SHARE_NAME = "steer-quiz" + String.fromCharCode(46) + "png";
let hudEl;
let C;
let S;

// display only: "kg/m2" is drawn as "kg/m²" (the checked text in claims.json is unchanged)
const disp = (t) => String(t).split("/m2").join("/m\u00b2");
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.classList.add(...[].concat(cls));
  if (text !== undefined && text !== null) e.textContent = disp(text);
  return e;
}
function show(...nodes) {
  const s = h("section", "screen");
  s.append(...nodes);
  main.replaceChildren(s);
  window.scrollTo(0, 0);
}
function button(label, onclick, cls) {
  const b = h("button", ["btn"].concat(cls || []), label);
  b.type = "button";
  b.addEventListener("click", onclick);
  return b;
}
// "Question N of M": M counts the hook and every step picked (gap cards count, unscored); the hook has no M yet
function fill(t, n, m) { return t.replace("{n}", String(n)).replace("{m}", String(m)); }
function progress(n) {
  return h("p", "progress", S.total ? fill(C.ui.progress, n, S.total) : fill(C.ui.progress_first, n, 0));
}
function allRounds() { return [C.hook].concat(C.rounds); }

// the 10 s ring: decoration only (aria-hidden, never announced, no digits). It starts when the question, context and
// choices are on screen; at zero it only dims: no auto-pick, no wrong, no lock-out
function ring() {
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 36 36");
  svg.setAttribute("class", "ring");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  ["bg", "fg"].forEach((k) => {
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("class", k);
    c.setAttribute("cx", "18");
    c.setAttribute("cy", "18");
    c.setAttribute("r", "15");
    c.setAttribute("pathLength", "100");
    svg.append(c);
  });
  svg.lastChild.addEventListener("animationend", () => svg.classList.add("done"));
  return svg;
}

function ask(round, done, n) {
  const prog = progress(n);
  const rg = ring();
  prog.append(rg);
  const nodes = [prog, h("p", "opener", round.opener)];
  nodes.push(h("h1", "q", round.question));
  if (round.context) nodes.push(h("p", ["context", "small"], round.context));
  if (round.prompt) nodes.push(h("p", "prompt", round.prompt));
  const box = h("div", "choices");
  round.stops.forEach((s, i) => {
    const b = h("button", "choice", s.label);
    b.type = "button";
    b.addEventListener("click", () => done(i));
    box.append(b);
  });
  nodes.push(box);
  show(...nodes);
  requestAnimationFrame(() => requestAnimationFrame(() => rg.classList.add("go")));
}

// a finding is never drawn without its qualifiers: the build puts all of them (the one-study note included, for single
// studies only) in round.qualifiers, and every surface draws that list
function quals(round) {
  return round.qualifiers;
}
function qualList(round, cls) {
  const ul = h("ul", cls || "quals");
  quals(round).forEach((q) => ul.append(h("li", null, q)));
  return ul;
}

function reveal(round, g, next) {
  const res = grade(g);
  const verdict = h("div", ["verdict", "r-" + res]);
  verdict.append(h("p", "rres", C.ui["result_" + res]), h("span", "pts", "+" + String(C.points[res])));
  const cmp = h("div", "cmp");
  [[C.ui.you_guessed, round.stops[g.idx].label], [C.ui.study_range, round.stops[binOf(round)].label]].forEach((r) => {
    const row = h("p", "crow");
    row.append(h("span", null, r[0]), h("b", null, r[1]));
    cmp.append(row);
  });
  // the verified number and its sentence appear whole, after the panel and the labels have animated in
  const fin = h("div", "final");
  round.reveals.forEach((rv) => {
    const card = h("div", "reveal");
    const row = h("div", "numrow");
    // a round with no number draws its label large instead
    if (rv.number) row.append(h("span", "num", rv.number), h("span", "rlabel", rv.label));
    else row.append(h("span", ["rlabel", "lead"], rv.label));
    card.append(row, h("p", "sentence", rv.sentence));
    fin.append(card);
  });
  const ul = qualList(round);
  if (ul.children.length) fin.append(ul);
  const src = h("p", "src");
  src.append(h("span", null, round.source.short), h("span", null, round.source.location));
  fin.append(src);
  const panel = h("div", "quote");
  panel.hidden = true;
  panel.append(h("blockquote", null, round.quote), h("p", "small", round.source.full), h("p", "small", round.source.doi));
  const tog = h("button", "link", C.ui.see_quote);
  tog.type = "button";
  tog.setAttribute("aria-expanded", "false");
  tog.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    tog.textContent = panel.hidden ? C.ui.see_quote : C.ui.hide_quote;
    tog.setAttribute("aria-expanded", String(!panel.hidden));
  });
  fin.append(tog, panel, button(C.ui.next, next));
  show(verdict, cmp, fin);
  verdict.setAttribute("aria-live", "polite");
}

function playRound(round, next, n) {
  ask(round, (idx) => {
    const g = { round, idx };
    S.guesses.push(g);
    const res = grade(g);
    S.points += C.points[res];
    S.streak = res === "closest" ? S.streak + 1 : 0;
    if (res === "closest" && navigator.vibrate) navigator.vibrate(40);
    hud();
    reveal(round, g, next);
  }, n);
}

function hud() {
  hudEl.hidden = !S.guesses.length;
  hudEl.textContent = C.ui.score_label + SEP + String(S.points) + DOTSEP + C.ui.streak_label + SEP + String(S.streak);
}

// an info card, not a guess: nothing is asked and nothing enters S.guesses
function gapCard(card, next, n) {
  const c = h("div", ["card", "gap"]);
  if (card.context) c.append(h("p", "context", card.context), h("p", "small", card.source.short));
  c.append(h("h2", null, card.title), h("p", null, card.body));
  show(progress(n), h("p", "opener", card.opener), c, button(C.ui.next, next));
}

function picker() {
  const box = h("div", "chips");
  const start = button(C.ui.start_rounds, () => run(0));
  C.doubts.forEach((d) => {
    const hookOnly = d.answered_by.length === 1 && d.answered_by[0] === "hook";
    const c = h("button", hookOnly ? ["chip", "done"] : "chip");
    c.type = "button";
    c.append(h("span", null, d.label));
    if (hookOnly) {
      c.append(h("small", null, C.ui.done));
      c.disabled = true;
    } else {
      c.setAttribute("aria-pressed", "false");
      c.addEventListener("click", () => {
        const on = c.getAttribute("aria-pressed") !== "true";
        c.setAttribute("aria-pressed", String(on));
        S.picked = C.doubts.filter((x) => x === d ? on : S.picked.includes(x));
      });
    }
    box.append(c);
  });
  show(h("h1", "q", C.ui.pick_worries), h("p", "small", C.ui.pick_hint), box, start);
}

function run(i) {
  const steps = [];
  S.picked.forEach((d) => d.answered_by.forEach((id) => {
    if (id === "hook") return;
    const r = C.rounds.find((x) => x.id === id);
    if (r) steps.push({ round: r });
    else steps.push({ card: C.gap_cards.find((x) => x.id === id) });
  }));
  S.total = steps.length + 1;
  const go = (k) => {
    if (k >= steps.length) return readout();
    const st = steps[k];
    if (st.round) playRound(st.round, () => go(k + 1), k + 2);
    else gapCard(st.card, () => go(k + 1), k + 2);
  };
  go(i);
}

// a choice with numeric stops is a bin scale (value = lower end of the bin); the answer falls in exactly one bin.
// Same bin = closest range, one bin off = close estimate, further = different. Direction rounds: right or different.
const isNum = (r) => typeof r.stops[0].value === "number";
const binOf = (r) => r.stops.filter((s) => s.value <= r.answer).length - 1;
function grade(g) {
  if (isNum(g.round)) {
    const d = Math.abs(g.idx - binOf(g.round));
    return d === 0 ? "closest" : d === 1 ? "close" : "different";
  }
  return g.round.stops[g.idx].value === g.round.answer ? "closest" : "different";
}
function questions() {
  const qs = [];
  S.picked.map((d) => d.id).concat("is_it_for_me").forEach((id) => (C.doctor_questions[id] || []).forEach((q) => qs.push(q)));
  return qs.slice(0, 3);
}

function readout() {
  const nodes = [h("h1", "q", C.ui.readout_title)];
  const nums = S.guesses.filter((g) => isNum(g.round));
  const dirs = S.guesses.filter((g) => !isNum(g.round));
  const won = (list) => list.filter((g) => grade(g) === "closest").length;
  const card = h("div", "card");
  card.append(h("p", "small", C.ui.score_label + SEP + String(S.points)));
  if (nums.length) card.append(h("p", "big", fill(C.readout.numbers, won(nums), nums.length)));
  if (dirs.length) card.append(h("p", "big", fill(C.readout.direction, won(dirs), dirs.length)));
  nodes.push(card);
  nodes.push(h("h2", null, C.readout.meaning_title));
  // grouped by the doubts; a gap card is information, never scored
  C.doubts.forEach((d) => {
    const gs = S.guesses.filter((g) => d.answered_by.includes(g.round.id));
    const cards = S.picked.includes(d) ? C.gap_cards.filter((x) => d.answered_by.includes(x.id)) : [];
    if (!gs.length && !cards.length) return;
    const grp = h("div", ["card", "group"]);
    const head = h("div", "ghead");
    head.append(h("h3", null, d.label));
    if (gs.some((g) => grade(g) === "different")) head.append(h("span", "tag", C.ui.worth_a_chat));
    grp.append(head);
    const ul = h("ul", "list");
    gs.forEach((g) => {
      const li = h("li");
      li.append(h("p", ["rres", "r-" + grade(g)], C.ui["result_" + grade(g)]));
      g.round.reveals.forEach((rv) => li.append(h("p", null, rv.sentence)));
      li.append(qualList(g.round, ["quals", "tiny"]), h("p", "small", g.round.source.short));
      ul.append(li);
    });
    cards.forEach((x) => {
      const li = h("li");
      li.append(h("p", "small", C.ui.unscored));
      if (x.context) li.append(h("p", null, x.context), h("p", "small", x.source.short));
      li.append(h("p", null, x.body));
      ul.append(li);
    });
    grp.append(ul);
    nodes.push(grp);
  });
  const qs = questions();
  const qc = h("div", "card");
  qc.append(h("h2", null, C.ui.questions_title));
  const ql = h("ul", "list");
  qs.forEach((q) => ql.append(h("li", null, q)));
  qc.append(ql);
  const sc = h("div", "sharebox");
  nodes.push(qc, button(C.ui.share_make, () => shareCard(sc), "alt"), sc, button(C.ui.next, nextStep));
  show(...nodes);
}

// the share card: drawn locally on a canvas, only when tapped. It holds the count and fixed lines, nothing else (no doubts,
// guesses or contact data). navigator.share with the image where the browser can, else a download.
function wrapLines(ctx, text, width) {
  const lines = [];
  let line = "";
  text.split(" ").forEach((w) => {
    const t = line ? line + " " + w : w;
    if (line && ctx.measureText(t).width > width) { lines.push(line); line = w; } else line = t;
  });
  lines.push(line);
  return lines;
}
async function shareCard(into) {
  const pal = C.brand.palette;
  const ff = getComputedStyle(document.documentElement).getPropertyValue("--serif");
  const sans = getComputedStyle(document.documentElement).getPropertyValue("--sans");
  const W = 1080;
  const H = 1350;
  const cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext("2d");
  const serif = (px) => "italic 600 " + String(px) + "px " + ff;
  try { await Promise.all([document.fonts.load(serif(80)), document.fonts.load("500 36px " + sans)]); } catch (x) { /* system font */ }
  ctx.fillStyle = pal.cream;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = pal.blush;
  ctx.fillRect(0, 0, W, 24);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = pal.maroon;
  ctx.font = serif(96);
  ctx.fillText(C.brand.wordmark, 90, 190);
  const m = S.guesses.length;
  const n = S.guesses.filter((g) => grade(g) === "closest").length;
  // a ring of the share of guesses that matched the study range
  ctx.lineWidth = 36;
  ctx.lineCap = "round";
  ctx.strokeStyle = pal.blush;
  ctx.beginPath();
  ctx.arc(W / 2, 560, 200, 0, Math.PI * 2);
  ctx.stroke();
  if (n) {
    ctx.strokeStyle = pal.rust;
    ctx.beginPath();
    ctx.arc(W / 2, 560, 200, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * n) / m);
    ctx.stroke();
  }
  ctx.fillStyle = pal.rust;
  ctx.textAlign = "center";
  ctx.font = serif(150);
  ctx.fillText(String(n), W / 2, 600);
  ctx.fillStyle = pal.maroon;
  ctx.font = serif(64);
  wrapLines(ctx, fill(C.ui.share_line, n, m), W - 200).forEach((l, i) => ctx.fillText(l, W / 2, 910 + i * 84));
  ctx.fillStyle = pal.clay;
  ctx.font = "500 36px " + sans;
  wrapLines(ctx, C.ui.share_note, W - 240).forEach((l, i) => ctx.fillText(l, W / 2, 1140 + i * 50));
  ctx.font = "600 40px " + sans;
  ctx.fillStyle = pal.maroon;
  ctx.fillText(C.brand.signoff, W / 2, 1270);
  cv.classList.add("sharecard");
  into.replaceChildren(cv);
  cv.toBlob((blob) => {
    if (!blob) return;
    const file = new File([blob], SHARE_NAME, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: fill(C.ui.share_line, n, m) }).catch(() => {});
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = SHARE_NAME;
    document.body.append(a);
    a.click();
    a.remove();
  }, "image/png");
}

function link(l, cls) {
  const a = h("a", ["btn"].concat(cls || []), l.label);
  a.href = l.url; // exactly as given, nothing appended
  return a;
}

function copyText(text, ok) {
  const old = () => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.append(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (x) { /* nothing to do */ }
    ta.remove();
    if (done && ok) ok();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok || (() => {}), old);
  else old();
}

// demo only: nothing is submitted, stored or put in a URL; the preview is drawn from the page's own state
function warmLead() {
  const w = C.warm_lead;
  const card = h("div", ["card", "warm"]);
  card.append(h("h2", null, w.title), h("p", ["small", "demo"], w.note));
  const field = (label, type) => {
    const l = h("label", "field");
    const i = document.createElement("input");
    i.type = type;
    i.autocomplete = "off";
    l.append(h("span", null, label), i);
    return [l, i];
  };
  const [nl, name] = field(w.name_label, "text");
  const [pl, phone] = field(w.phone_label, "tel");
  const cl = h("label", "consent");
  const tick = document.createElement("input");
  tick.type = "checkbox";
  cl.append(tick, h("span", null, w.consent_label));
  const prev = h("div", "preview");
  prev.hidden = true;
  const showBtn = button(w.show_label, () => {
    const sep = COLON + " ";
    const rows = [[w.name_label, name.value], [w.phone_label, phone.value], [w.consent_short, tick.checked ? w.yes_label : ""],
      [w.doubts_label, S.picked.map((d) => d.label).join(COMMA + " ")]];
    const gl = h("ul", "list");
    S.guesses.forEach((g) => {
      const li = h("li");
      li.append(h("p", null, w.your_guess + sep + g.round.stops[g.idx].label + " " + DOT + " " + w.the_study + sep +
        g.round.reveals.map((rv) => (rv.number ? rv.number + " " : "") + rv.label).join(" ")), qualList(g.round, ["quals", "tiny"]));
      gl.append(li);
    });
    const ql = h("ul", "list");
    questions().forEach((q) => ql.append(h("li", null, q)));
    prev.replaceChildren(h("h3", null, w.preview_title), ...rows.map((r) => h("p", "prow", r[0] + sep + r[1])),
      h("h4", null, w.guesses_label), gl, h("h4", null, C.ui.questions_title), ql);
    prev.hidden = false;
  }, "alt");
  showBtn.disabled = true;
  tick.addEventListener("change", () => { showBtn.disabled = !tick.checked; if (!tick.checked) prev.hidden = true; });
  // the questions, then what the studies said with the same qualifiers as on screen (never a finding alone)
  const text = () => {
    const out = [C.ui.questions_title].concat(questions(), [""]);
    S.guesses.forEach((g) => {
      g.round.reveals.forEach((rv) => out.push(rv.sentence));
      quals(g.round).forEach((q) => out.push(q));
      out.push(g.round.source.short, "");
    });
    return out.join(NL);
  };
  // "Copied" only after a successful write, for 2 s; a Web Animation times it (no timers in this file, and the reduced-motion CSS cannot stop it)
  const note = h("p", ["small", "copied"], C.ui.copied);
  note.hidden = true;
  note.setAttribute("role", "status");
  let flash = null;
  const copied = () => {
    if (flash) flash.cancel();
    note.hidden = false;
    flash = note.animate([{ opacity: 1 }, { opacity: 1 }], 2000);
    flash.onfinish = () => { note.hidden = true; };
  };
  const cp = button(w.copy_label, () => copyText(text(), copied), "alt");
  const sh = button(w.share_label, () => {
    if (navigator.share) navigator.share({ title: w.share_title, text: text() }).catch(() => {});
    else copyText(text());
  }, "alt");
  card.append(nl, pl, cl, showBtn, prev, cp, note, sh);
  return card;
}

function nextStep() {
  show(link(C.cta.primary), link(C.cta.secondary, "alt"), warmLead(), button(C.ui.restart, start, "alt"));
}

function start() {
  S = { picked: [], guesses: [], total: 0, points: 0, streak: 0 };
  hud();
  playRound(C.hook, picker, 1);
}

async function load() {
  const el = document.getElementById("claims");
  if (el) return JSON.parse(el.textContent);
  const r = await fetch("./claims.json");
  return r.json();
}

load().then((c) => {
  C = c;
  Object.entries(c.brand.palette).forEach(([k, v]) => document.documentElement.style.setProperty("--" + k, v));
  document.title = c.brand.wordmark;
  const top = document.getElementById("top");
  top.textContent = c.brand.wordmark;
  hudEl = h("span", "hud");
  hudEl.hidden = true;
  top.append(hudEl);
  const f = document.getElementById("foot");
  f.append(h("span", null, c.brand.footer), h("span", null, c.brand.signoff));
  const meta = document.createElement("meta");   // the build time stays in the page, not on screen
  meta.setAttribute("name", "steer-built-at");
  meta.setAttribute("content", c.built_at);
  document.head.append(meta);
  start();
});
</script>
